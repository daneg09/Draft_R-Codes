[project]
name = "rcodes"
version = "0.1.0"
description = "Rules engine and knowledge graph for the Western Australian Residential Design Codes"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
geometry = ["shapely>=2"]
dev = ["pytest>=8"]

[project.scripts]
rcodes = "rcodes.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rcodes = ["**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
